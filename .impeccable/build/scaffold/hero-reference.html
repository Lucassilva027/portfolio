<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Scaffold reference: grounded-court.jpg</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=League+Gothic:wght@400&family=Butterfly+Kids:wght@400&display=swap">
  <link rel="stylesheet" href="layout.css">
  <style>html,body{margin:0}body{background:#111210}.region{box-sizing:border-box}.region.text p{white-space:pre-wrap}</style>
</head>
<body>
<!-- Reference only. Every region sits at its measured box inside a comp-aspect frame. Take the boxes (layout.css), keep your own semantic structure. -->
<main class="comp-frame" style="max-width:1280px">
  <figure class="r-court-floor region plate" data-region="court-floor"><img src="../../../assets/plates/court-floor.png" alt="" style="width:100%;height:100%;object-fit:contain;object-position:center"></figure>
  <div class="r-nav region chrome" data-region="nav"><!-- Top navigation strip: LS mark, Projetos Stack Sobre Contato, email and WhatsApp --></div>
  <div class="r-name region text" data-region="name"><!-- LUCAS OLIVEIRA DA SILVA large white condensed display --><p style="font-size:var(--r-name-font);font-family:var(--r-name-family),sans-serif;font-weight:var(--r-name-weight);line-height:1.05;margin:0">name</p></div>
  <div class="r-tagline region text" data-region="tagline"><!-- DESENVOLVO WEB APPS, AGENTES DE IA E GAMES DE NAVEGADOR with AGENTES DE IA in orange --><p style="font-size:var(--r-tagline-font);line-height:1.05;margin:0">tagline</p></div>
  <div class="r-featured-kicker region text" data-region="featured-kicker"><!-- PROJETO EM DESTAQUE small orange caps inside free-throw circle --><p style="line-height:1.05;margin:0">featured-kicker</p></div>
  <div class="r-featured-title region text" data-region="featured-title"><!-- PHILOMEDIA white serif display inside circle --><p style="font-size:var(--r-featured-title-font);font-family:var(--r-featured-title-family),sans-serif;font-weight:var(--r-featured-title-weight);line-height:1.05;margin:0">featured-title</p></div>
  <div class="r-featured-body region text" data-region="featured-body"><!-- PhiloMedia one-line summary white sans inside circle --><p style="font-size:var(--r-featured-body-font);line-height:1.05;margin:0">featured-body</p></div>
  <div class="r-featured-cta region control" data-region="featured-cta"><!-- VER PROJETO link with orange arrow: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop featured-cta); a control need not have button chrome --></div>
  <div class="r-arc-emporio-kicker region text" data-region="arc-emporio-kicker"><!-- AGENTE DE IA orange small caps --><p style="font-size:var(--r-arc-emporio-kicker-font);line-height:1.05;margin:0">arc-emporio-kicker</p></div>
  <div class="r-arc-emporio-title region text" data-region="arc-emporio-title"><!-- EMPÓRIO AI AGENT white serif --><p style="font-size:var(--r-arc-emporio-title-font);line-height:1.05;margin:0">arc-emporio-title</p></div>
  <div class="r-arc-emporio-body region text" data-region="arc-emporio-body"><!-- Empório short summary white --><p style="font-size:var(--r-arc-emporio-body-font);line-height:1.05;margin:0">arc-emporio-body</p></div>
  <div class="r-arc-emporio-cta region control" data-region="arc-emporio-cta"><!-- EXPLORAR link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arc-emporio-cta); a control need not have button chrome --></div>
  <div class="r-arc-pirate-kicker region text" data-region="arc-pirate-kicker"><!-- JOGO DE NAVEGADOR orange small caps --><p style="font-size:var(--r-arc-pirate-kicker-font);line-height:1.05;margin:0">arc-pirate-kicker</p></div>
  <div class="r-arc-pirate-title region text" data-region="arc-pirate-title"><!-- PIRATE BATTLE white serif --><p style="font-size:var(--r-arc-pirate-title-font);line-height:1.05;margin:0">arc-pirate-title</p></div>
  <div class="r-arc-pirate-body region text" data-region="arc-pirate-body"><!-- Pirate Battle short summary white --><p style="font-size:var(--r-arc-pirate-body-font);line-height:1.05;margin:0">arc-pirate-body</p></div>
  <div class="r-arc-pirate-cta region control" data-region="arc-pirate-cta"><!-- JOGAR link: match the control's lettering and visible shape to the crop (comp-spec.mjs --crop arc-pirate-cta); a control need not have button chrome --></div>
</main>
</body>
</html>
